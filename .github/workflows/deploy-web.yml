# Web sitesini derleyip GitHub Pages'e yayınlar → https://notdulbutcool.com
# Supabase bağlantısı için Settings → Secrets and variables → Actions → Variables:
#   SUPABASE_URL, SUPABASE_ANON_KEY  (boş bırakılırsa site demo modda yayınlanır)
name: Web'i yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Derle
        run: >
          flutter build web --release
          --dart-define=SITE_URL=https://notdulbutcool.com
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

      # Tek sayfa uygulama: /uyelik gibi yollar yenilendiğinde 404 yerine uygulama açılsın.
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
